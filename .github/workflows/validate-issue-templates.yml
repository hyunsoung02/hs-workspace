name: test 라벨 자동 검증
run-name: ${{ github.event_name == 'issues' && format('{0} - Test 1 (자동 프로젝트 테스트)', github.event.issue.title) || github.event_name == 'workflow_dispatch' && format('이슈 {0} - Test 1 (자동 프로젝트 테스트)', inputs.issue_number) || format('Test 1 ({0})', github.sha) }}

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 결과를 기록할 이슈 번호
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  test:
    name: 프로젝트 테스트 실행
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'test' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v6
      - name: 프로젝트 테스트 실행
        id: run-test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.issue_number || github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          BODY=$(gh issue view "${ISSUE_NUMBER}" --json body --jq .body)
          TEST_PATH=$(printf '%s\\n' "${BODY}" | sed -n 's/^<!-- test-path: \\(.*\\) -->$/\\1/p' | head -n 1)
          if [ -n "${TEST_PATH}" ]; then
            case "${TEST_PATH}" in tests|tests/*) ;; *) echo "test-path는 tests 경로만 허용합니다."; exit 1 ;; esac
            test -e "${TEST_PATH}"
            python -m pip install --upgrade pip
            python -m pip install pytest
            pytest "${TEST_PATH}" 2>&1 | tee test-result.log
          elif [ -d .github/ISSUE_TEMPLATE ]; then
            test -d .github/ISSUE_TEMPLATE
          else
            echo '이슈에 <!-- test-path: tests/... --> 경로를 지정하세요.'; exit 1
          fi
      - name: 결과 라벨 준비
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create test --color 1D76DB --description '테스트 실행 요청' --force || true
          gh label create test:passed --color 0E8A16 --description '테스트 통과' --force || true
          gh label create test:failed --color B60205 --description '테스트 실패' --force || true
      - name: 테스트 결과를 이슈에 기록
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.issue_number || github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.run-test.outcome }}" = success ]; then
            gh issue edit "${ISSUE_NUMBER}" --add-label test:passed --remove-label test:failed
            gh issue comment "${ISSUE_NUMBER}" --body "✅ 테스트 통과\\n\\n- 저장소: ${{ github.repository }}\\n- 실행 링크: ${RUN_URL}"
          else
            gh issue edit "${ISSUE_NUMBER}" --add-label test:failed --remove-label test:passed
            gh issue comment "${ISSUE_NUMBER}" --body "❌ 테스트 실패\\n\\n- 저장소: ${{ github.repository }}\\n- 실행 링크: ${RUN_URL}\\n- 상세 원인: Actions 로그를 확인하세요."
            gh issue edit "${ISSUE_NUMBER}" --remove-label test || true
            exit 1
          fi
          gh issue edit "${ISSUE_NUMBER}" --remove-label test || true
